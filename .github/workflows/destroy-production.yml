name: Destroy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DESTROY_PROD para confirmar"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: marathon-production
  cancel-in-progress: false

jobs:
  destroy:
    name: Clean Unity Catalog and destroy
    if: ${{ inputs.confirmation == 'DESTROY_PROD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean and destroy production
        run: python scripts/destroy_all.py --environment prod --yes
